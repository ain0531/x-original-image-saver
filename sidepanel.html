<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X 原寸画像保存</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        overflow-wrap: anywhere;
      }

      input[type="number"] {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
      }

      h1 {
        font-size: 14px;
        margin: 0 0 12px 0;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .action-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .action-option {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #333;
      }

      button {
        padding: 10px;
        font-size: 13px;
        cursor: pointer;
      }

      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #333;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>X 原寸画像保存</h1>
    <p style="font-size:12px">スクロールせずに保存します。ブックマークの投稿データを取得できない場合は、読み込み済み画像のみが対象です。</p>

    <div class="button-group">
      <div class="action-row">
        <button id="save-current-tweet">現在の投稿の画像を保存</button>
        <label class="action-option">
          <input id="check-current-saved-list" type="checkbox" checked />
          保存履歴を確認して重複を避ける
        </label>
      </div>

      <div class="action-row">
        <button id="save-all-visible">画像をまとめて保存</button>
        <label class="action-option">
          <input id="check-all-saved-list" type="checkbox" checked />
          保存履歴を確認して重複を避ける
        </label>
      </div>

      <div class="action-row">
        <button id="clear-saved-history">保存履歴を消去</button>
      </div>
      <button id="pause-save" disabled>一時停止</button>
      <button id="resume-save" disabled>未処理分・続きから再開</button>
    </div>

    <p><button id="open-options" type="button">オプション</button></p>

    <div id="status" role="status" aria-live="polite">待機中</div>

    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
