<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>X Original Image Saver</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        min-width: 260px;
      }

      h1 {
        font-size: 14px;
        margin: 0 0 12px 0;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      button {
        padding: 10px;
        font-size: 13px;
        cursor: pointer;
      }

      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #333;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>X Original Image Saver</h1>

    <div class="button-group">
      <button id="save-current-tweet">Save current tweet images</button>
      <button id="save-all-visible">Save all visible images</button>
      <button id="clear-saved-history">Clear saved history</button>
    </div>

    <div id="status">Ready.</div>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
